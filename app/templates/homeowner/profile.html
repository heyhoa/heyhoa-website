{% extends "homeowner/base.html" %}
{% block title %}Profile — {{ brand.name }}{% endblock %}
{% block page_title %}My profile{% endblock %}
{% block content %}
<form class="card" method="post" style="max-width:720px">
  <div class="form-row">
    <div class="form-group"><label for="p-name">Name on account</label><input class="form-control" id="p-name" value="{{ ua.owner_name }}" disabled><span class="form-help-text">Changes to ownership go through the county deed and a closing; ask hey if you need to add a co-owner.</span></div>
    <div class="form-group"><label for="p-unit">Property</label><input class="form-control" id="p-unit" value="{{ ua.unit_label }} · {{ ua.address }}" disabled></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label for="p-email">Email</label><input class="form-control" id="p-email" name="email" type="email" value="{{ me.email }}"></div>
    <div class="form-group"><label for="p-phone">Mobile</label><input class="form-control" id="p-phone" name="phone" value="{{ ua.phone }}"></div>
  </div>
  <div class="form-group"><label for="p-mail">Mailing address (if different)</label><input class="form-control" id="p-mail" name="mailing_address" placeholder="Same as property"></div>
  <label>Notifications</label>
  <div class="form-checkbox-group"><input type="checkbox" id="n1" checked><label for="n1">Text me when a payment posts or fails</label></div>
  <div class="form-checkbox-group"><input type="checkbox" id="n2" checked><label for="n2">Email me statements and board announcements</label></div>
  <div class="form-checkbox-group"><input type="checkbox" id="n3"><label for="n3">Paper statements by mail ($1.25 each)</label></div>
  <div class="form-checkbox-group"><input type="checkbox" id="n4" checked><label for="n4">Show my name and unit in the owner directory</label></div>
  <button class="btn btn-primary" type="submit" style="margin-top:1rem">Save</button>
</form>
{% endblock %}
